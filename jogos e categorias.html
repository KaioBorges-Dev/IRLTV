<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Jogos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .barra-filtros {
      margin: 15px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
    }

    .card img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 5px;
    }

    .card h3 {
      margin: 8px 0 4px;
      font-sinze: 14px
      color: #555;
    }
